name: Aggiorna classifiche

on:
  schedule:
    # Ogni giorno alle 04:15 UTC = 06:15 ora legale italiana (05:15 ora solare).
    - cron: '15 4 * * *'
  # Anche dal sito (public/api/_inc/aggiornamenti.php): alla prima visita del giorno e dal pulsante dell'amministratore.
  workflow_dispatch:
    inputs:
      seed:
        description: 'Prima run: recupera anche lo storico (Netflix 2 anni, FIMI 5 anni)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aggiorna-classifiche
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Cache HTTP tra una run e l'altra (es. il file Netflix da 30 MB non viene riscaricato nello stesso giorno).
      - uses: actions/cache@v6
        with:
          path: .cache
          key: http-${{ github.run_id }}
          restore-keys: http-

      # Commit di partenza: la pubblicazione confronta le classifiche nuove con queste (riepilogo per l'amministratore).
      - name: Commit di partenza
        run: echo "PRIMA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Ingestion e aggregazione
        run: npm run ${{ inputs.seed && 'seed' || 'update' }}
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          CLASSIFICHE_CONTACT: ${{ github.server_url }}/${{ github.repository }}

      - name: Test
        run: npm test

      - name: Commit dei dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati"
            exit 0
          fi
          git commit -m "Dati: aggiornamento del $(TZ=Europe/Rome date +%F)"
          git push

      # Pubblicazione su Aruba senza FTP (scripts/pubblica-aruba.ts): manda al server uno zip con i file cambiati.
      # Anche senza dati nuovi, così arrivano le modifiche al codice. Senza il secret ARUBA_CHIAVE viene saltata.
      - name: Pubblicazione su Aruba
        run: npm run pubblica:aruba
        env:
          ARUBA_CHIAVE: ${{ secrets.ARUBA_CHIAVE }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TRAKT_ACCOUNT: ${{ secrets.TRAKT_ACCOUNT }}
          CLASSIFICHE_CONTACT: ${{ github.server_url }}/${{ github.repository }}
